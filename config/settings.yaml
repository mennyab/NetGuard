# הגדרות כלליות של NetGuard

connection:
  prefer_protocol: ssh          # ssh קודם, telnet רק אם ssh לא זמין
  ssh_port: 22
  telnet_port: 23
  timeout_seconds: 15
  # כמה קווי VTY להשאיר פנויים תמיד, כדי לא לחסום את המשתמש.
  # אם מספר הקווים הפנויים <= הערך הזה - המערכת לא מתחברת.
  vty_reserve_lines: 1
  # פקודות שאסור למערכת להריץ לעולם (מנתקות סשנים קיימים / מסכנות את ההתקן)
  forbidden_commands:
    - "clear line"
    - "clear ip ssh"
    - "clear tcp"
    - "no ip ssh"
    - "no transport input"
    - "crypto key zeroize"
    - "reload"
    - "erase"
    - "delete"
    - "format"
    - "write erase"

login_attempts:
  max_per_device: 5             # מקסימום ניסיונות התחברות להתקן בסריקה אחת
  delay_seconds: 5              # השהיה בין ניסיונות
  stop_on_lockout_signs: true   # עצירה מיידית אם מזוהה נעילה
  # סדר הניסיונות:
  # 1) פרטים שהמשתמש הזין  2) סיסמת ברירת מחדל "cisco"
  # 3) ברירות מחדל לפי היצרן שזוהה  4) שאלת המשתמש
  ask_user_on_failure: true

discovery:
  ping_timeout_seconds: 1
  snmp_timeout_seconds: 2
  snmp_retries: 1
  nmap_arguments: "-sV --top-ports 100 -T4"
  snmp_oids:
    sysDescr:    "1.3.6.1.2.1.1.1.0"
    sysObjectID: "1.3.6.1.2.1.1.2.0"
    sysName:     "1.3.6.1.2.1.1.5.0"
    sysServices: "1.3.6.1.2.1.1.7.0"

mitigation:
  require_typed_approval: true
  approval_word: "APPROVE"
  backup_before_change: true

storage:
  database_path: "storage/netguard.db"
  backups_dir: "storage/backups"
  log_path: "storage/audit.log"
