# מדיניות סיסמאות חזקות (מבוסס NIST SP 800-63B ונהלים מקובלים בארגונים)

min_length: 12
min_length_admin: 14            # משתמשים עם privilege 15 / enable
require_uppercase: true
require_lowercase: true
require_digit: true
require_special: true
special_characters: "!@#$%^&*()-_=+[]{};:,.<>?/~|"

forbid_common_passwords: true   # רשימה שחורה (config/common_passwords.txt)
forbid_context_words: true      # שם משתמש / שם התקן / שם הארגון
context_words: []               # מילים נוספות לפסילה, למשל שם בית הספר

max_repeated_chars: 3           # "aaaa" נפסל
forbid_sequences: true          # "1234", "abcd", "qwerty"
forbid_reuse_across_devices: true

# ציון zxcvbn מינימלי (0-4)
min_strength_score: 3

# סוגי הצפנה בקונפיגורציה של התקני רשת וחומרת החולשה
encryption_types:
  type0: { name: "טקסט גלוי",        severity: critical }
  type7: { name: "Vigenere (הפיך)",  severity: high }
  type5: { name: "MD5",              severity: medium }
  type8: { name: "PBKDF2-SHA256",    severity: ok }
  type9: { name: "scrypt",           severity: ok }

# הגדרות הגנה על התחברות שהמערכת בודקת בהתקנים
login_hardening_checks:
  - login_block_for
  - exec_timeout
  - security_passwords_min_length
  - service_password_encryption
